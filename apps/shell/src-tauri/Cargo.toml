[package]
name = "kidos-shell"
version = "0.1.0"
description = "KidOS Windows child-focused computing shell"
authors = ["KidOS"]
edition = "2021"

[lib]
name = "kidos_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
secure-store = { path = "../../../crates/secure-store" }
policy-core = { path = "../../../crates/policy-core" }
guardian-service = { path = "../../../crates/guardian-service" }
