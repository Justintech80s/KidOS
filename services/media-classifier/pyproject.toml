[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kidos-media-classifier"
version = "0.1.0"
description = "Local KidOS image/video safety classifier"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pillow>=10,<12",
  "transformers>=4.48,<5",
  "torch>=2.5,<3",
  "opencv-python-headless>=4.10,<5",
  "pywin32>=308; sys_platform == 'win32'"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
packaging = [
  "pyinstaller>=6.11,<7",
  "huggingface-hub>=0.27,<1"
]

[tool.setuptools]
py-modules = ["app", "windows_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
