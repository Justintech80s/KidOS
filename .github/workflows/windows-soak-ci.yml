name: KidOS Windows Soak CI

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Soak duration in minutes"
        required: false
        default: "20"
  push:
    branches:
      - main
    paths:
      - "apps/shell/**"
      - "crates/**"
      - "services/media-classifier/**"
      - "scripts/windows/**"
      - "tests/windows/**"
      - ".github/workflows/windows-soak-ci.yml"
  schedule:
    - cron: '17 4 * * 0'

jobs:
  windows-soak:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify code before soak
        run: |
          node tests/packaging/tauri-config.test.mjs
          node tests/security/release-hardening.test.mjs
          pnpm -r test --run
          pnpm -r build
          cargo test --workspace
          cargo check --workspace

      - name: Package local classifier and model
        shell: pwsh
        run: ./scripts/windows/package-media-classifier.ps1

      - name: Build Guardian and installer
        run: |
          cargo build -p kidos-guardian-host --release
          pnpm --filter @kidos/shell tauri build --bundles nsis

      - name: Install KidOS for soak
        shell: pwsh
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $installer -ArgumentList "/S" -PassThru
          if (-not $process.WaitForExit(900000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "KidOS installer timed out after 15 minutes."
          }
          if ($process.ExitCode -ne 0) { throw "KidOS installer failed with $($process.ExitCode)." }

      - name: Run long-duration service soak
        shell: pwsh
        run: |
          $minutes = if ("${{ github.event_name }}" -eq "workflow_dispatch") { [int]"${{ inputs.minutes }}" } else { 20 }
          ./tests/windows/service-soak.ps1 -Minutes $minutes

      - name: Collect soak diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Get-Service KidOSGuardian,KidOSMediaClassifier -ErrorAction SilentlyContinue | Format-List * | Out-File artifacts/services.txt
          Get-Content "$env:ProgramData\KidOS\Guardian\recovery.log" -ErrorAction SilentlyContinue | Out-File artifacts/recovery.log
          $diag = Join-Path $env:ProgramData "KidOS\Diagnostics"
          if (Test-Path $diag) { Copy-Item (Join-Path $diag "*") artifacts -Recurse -Force -ErrorAction SilentlyContinue }
          $classifierLog = Join-Path $env:ProgramData "KidOS\Diagnostics\media-classifier-service.log"
          if (Test-Path $classifierLog) { Copy-Item $classifierLog artifacts/media-classifier-service.log -Force }
          Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=(Get-Date).AddMinutes(-60)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'KidOSGuardian|KidOSMediaClassifier' } |
            Select-Object TimeCreated,Id,LevelDisplayName,Message |
            Format-List * | Out-File artifacts/service-control-manager-events.txt

      - name: Upload soak diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Windows-Soak-Diagnostics
          path: artifacts
          if-no-files-found: warn
