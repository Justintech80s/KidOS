name: KidOS Desktop Electron CI

on:
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/shell/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/electron-desktop-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/desktop/**'
      - 'apps/shell/**'
      - 'packages/**'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/electron-desktop-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-electron-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Test Electron security boundary
        run: pnpm --filter @kidos/desktop test
      - name: Build KidOS Desktop installer
        run: pnpm --filter @kidos/desktop build
      - name: Verify packaged shell uses file-relative assets
        shell: pwsh
        run: |
          $index = Get-Content "apps/shell/dist/index.html" -Raw
          if ($index -match '(src|href)="/assets/') {
            throw "Electron shell contains absolute /assets URLs and would render blank from file://."
          }
          if ($index -notmatch '(src|href)="\./assets/') {
            throw "Electron shell did not produce relative ./assets URLs."
          }

      - name: Launch packaged Electron renderer smoke test
        shell: pwsh
        run: |
          $app = Get-ChildItem "apps/desktop/dist-installer/win-unpacked/*.exe" |
            Where-Object { $_.Name -eq "KidOS Desktop.exe" } |
            Select-Object -First 1
          if (-not $app) { throw "Packaged KidOS Desktop executable was not generated." }
          $env:KIDOS_ELECTRON_SMOKE = "1"
          $process = Start-Process -FilePath $app.FullName -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "KidOS Desktop renderer smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem apps/desktop/dist-installer/KidOS-Desktop-Windows-x64-*-Setup.exe | Select-Object -First 1
          if (-not $installer) { throw "KidOS Desktop installer was not generated." }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content apps/desktop/dist-installer/KidOS-Desktop-SHA256SUMS.txt -Encoding ascii
          Write-Host "Built $($installer.Name)"
      - name: Upload downloadable KidOS Desktop
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Desktop-Windows-x64
          path: |
            apps/desktop/dist-installer/KidOS-Desktop-Windows-x64-*-Setup.exe
            apps/desktop/dist-installer/KidOS-Desktop-SHA256SUMS.txt
          if-no-files-found: error
