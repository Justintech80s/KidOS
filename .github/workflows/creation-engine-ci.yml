name: KidOS Creation Engine CI

on:
  pull_request:
    branches:
      - main

jobs:
  verify-creation-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test creation engine
        run: pnpm --filter @kidos/creation-engine test --run

      - name: Typecheck creation engine
        run: pnpm --filter @kidos/creation-engine typecheck
