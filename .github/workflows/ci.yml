name: KidOS Windows Release CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/task-11-windows-packaging'

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify packaging metadata
        run: node tests/packaging/tauri-config.test.mjs
      - name: Verify production hardening invariants
        run: node tests/security/release-hardening.test.mjs
      - name: Run JavaScript tests
        run: pnpm -r test --run
      - name: Build JavaScript workspaces
        run: pnpm -r build
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Check Rust workspace
        run: cargo check --workspace
      - name: Package local KidOS media classifier
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/media-classifier[packaging]"
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='openai/clip-vit-base-patch32', local_dir='services/media-classifier/dist/model')"
          Push-Location services/media-classifier
          pyinstaller --clean --noconfirm kidos-media-classifier.spec
          Pop-Location
          if (-not (Test-Path "services/media-classifier/dist/kidos-media-classifier.exe")) { throw "Classifier executable was not produced." }
          if (-not (Test-Path "services/media-classifier/dist/model/config.json")) { throw "Classifier model bundle was not produced." }
      - name: Build privileged KidOS Guardian service
        run: cargo build -p kidos-guardian-host --release
      - name: Build KidOS Windows installer
        run: pnpm --filter @kidos/shell tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Windows-10-11-x64-Experimental
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
