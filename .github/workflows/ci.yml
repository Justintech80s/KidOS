name: KidOS Windows Release CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/task-11-windows-packaging'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify packaging metadata
        run: node tests/packaging/tauri-config.test.mjs
      - name: Verify production hardening invariants
        run: |
          node tests/security/release-hardening.test.mjs
          node tests/security/windows-code-signing-gate.test.mjs
      - name: Verify Windows PowerShell 5.1 installer credentials
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\windows\installer-credential-compat.ps1
      - name: Run JavaScript tests
        run: pnpm -r test --run
      - name: Build JavaScript workspaces
        run: pnpm -r build
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Check Rust workspace
        run: cargo check --workspace
      - name: Package local KidOS media classifier
        shell: pwsh
        run: ./scripts/windows/package-media-classifier.ps1
      - name: Build privileged KidOS Guardian service
        run: cargo build -p kidos-guardian-host --release
      - name: Build KidOS Windows installer
        run: pnpm --filter @kidos/shell tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Windows-10-11-x64-Experimental
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Prepare one-click experimental installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $source = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $destination = "target/release/KidOS-Windows-10-11-x64-Experimental.exe"
          Copy-Item $source $destination -Force

      - name: Publish one-click experimental download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "experimental-latest"
          $asset = "target/release/KidOS-Windows-10-11-x64-Experimental.exe"
          $repo = "${{ github.repository }}"
          $notes = "EXPERIMENTAL SOFTWARE. Use only in a VM, disposable Windows account, or device/account with no important files. This unsigned test build is for Windows 10/11 x64 and is not a production release."

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "KidOS Experimental Windows Build" --prerelease --notes $notes
          } else {
            gh release edit $tag --repo $repo --title "KidOS Experimental Windows Build" --prerelease --notes $notes
          }

          gh release upload $tag $asset --repo $repo --clobber
