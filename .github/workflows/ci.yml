name: KidOS Windows Release CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/task-11-windows-packaging'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Verify packaging metadata
        run: node tests/packaging/tauri-config.test.mjs
      - name: Verify installer lifecycle contract
        run: node tests/packaging/installer-lifecycle.test.mjs
      - name: Verify production hardening invariants
        run: |
          node tests/security/release-hardening.test.mjs
          node tests/security/windows-code-signing-gate.test.mjs
      - name: Verify Windows PowerShell 5.1 installer credentials
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\tests\windows\installer-credential-compat.ps1
      - name: Run JavaScript tests
        run: pnpm -r test --run
      - name: Build JavaScript workspaces
        run: pnpm -r build
      - name: Run Rust tests
        run: cargo test --workspace
      - name: Check Rust workspace
        run: cargo check --workspace
      - name: Package local KidOS media classifier
        shell: pwsh
        run: ./scripts/windows/package-media-classifier.ps1
      - name: Build privileged KidOS Guardian service
        run: cargo build -p kidos-guardian-host --release
      - name: Build KidOS Windows installer
        run: pnpm --filter @kidos/shell tauri build --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Windows-10-11-x64-Experimental
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Prepare one-click experimental installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $source = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          $destination = "target/release/KidOS-Windows-10-11-x64-Experimental.exe"
          Copy-Item $source $destination -Force

      - name: Publish one-click experimental download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "experimental-latest"
          $asset = "target/release/KidOS-Windows-10-11-x64-Experimental.exe"
          $repo = "${{ github.repository }}"
          $notes = "EXPERIMENTAL SOFTWARE. Use only in a VM, disposable Windows account, or device/account with no important files. This unsigned test build is for Windows 10/11 x64 and is not a production release."

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title "KidOS Experimental Windows Build" --prerelease --notes $notes
          } else {
            gh release edit $tag --repo $repo --title "KidOS Experimental Windows Build" --prerelease --notes $notes
          }

          gh release upload $tag $asset --repo $repo --clobber

  production-signing-gate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows-release
    runs-on: windows-latest
    environment: production
    env:
      KIDOS_WINDOWS_CERTIFICATE_BASE64: ${{ secrets.KIDOS_WINDOWS_CERTIFICATE_BASE64 }}
      KIDOS_WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.KIDOS_WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - name: Download validated unsigned installer
        uses: actions/download-artifact@v4
        with:
          name: KidOS-Windows-10-11-x64-Experimental
          path: target/release/unsigned

      - name: Require production signing credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:KIDOS_WINDOWS_CERTIFICATE_BASE64)) {
            throw "KIDOS_WINDOWS_CERTIFICATE_BASE64 is required for production promotion."
          }
          if ([string]::IsNullOrWhiteSpace($env:KIDOS_WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "KIDOS_WINDOWS_CERTIFICATE_PASSWORD is required for production promotion."
          }

      - name: Locate Windows SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "Windows SignTool was not found on the runner."
          }
          Split-Path $signtool.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Sign production installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "kidos-production-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:KIDOS_WINDOWS_CERTIFICATE_BASE64))
          $source = (Get-ChildItem target/release/unsigned/*-setup.exe | Select-Object -First 1).FullName
          if (-not $source) {
            throw "Validated Windows installer artifact was not found."
          }
          $signed = "target/release/KidOS-Windows-10-11-x64-Signed.exe"
          Copy-Item $source $signed -Force
          signtool.exe sign /f $certificatePath /p $env:KIDOS_WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr https://timestamp.digicert.com /td SHA256 $signed

      - name: Verify production Authenticode signature
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signed = "target/release/KidOS-Windows-10-11-x64-Signed.exe"
          signtool.exe verify /pa /v $signed
          $signature = Get-AuthenticodeSignature $signed
          if ($signature.Status -ne 'Valid') {
            throw "Production installer Authenticode status is $($signature.Status), not Valid."
          }

      - name: Generate production SHA256 manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $signed = "target/release/KidOS-Windows-10-11-x64-Signed.exe"
          $manifest = "target/release/KidOS-SHA256SUMS.txt"
          $hash = (Get-FileHash $signed -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *KidOS-Windows-10-11-x64-Signed.exe" | Set-Content -Path $manifest -Encoding ascii

      - name: Upload signed installer and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Windows-10-11-x64-Signed
          path: |
            target/release/KidOS-Windows-10-11-x64-Signed.exe
            target/release/KidOS-SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish verified production release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $repo = "${{ github.repository }}"
          $installer = "target/release/KidOS-Windows-10-11-x64-Signed.exe"
          $manifest = "target/release/KidOS-SHA256SUMS.txt"
          $notes = "Signed KidOS production build for Windows 10/11 x64. Authenticode verification and SHA-256 integrity generation completed in CI before publication."

          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $installer $manifest --repo $repo --title "KidOS $tag" --notes $notes
          } else {
            gh release upload $tag $installer $manifest --repo $repo --clobber
          }

      - name: Remove signing certificate material
        if: always()
        shell: pwsh
        run: Remove-Item (Join-Path $env:RUNNER_TEMP "kidos-production-signing.pfx") -Force -ErrorAction SilentlyContinue
