name: KidOS Media Safety Task 2 CI

on:
  push:
    branches:
      - feat/ai-media-safety-classifier
  pull_request:
    branches:
      - main

jobs:
  verify-media-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test media safety
        run: pnpm --filter @kidos/media-safety test --run

      - name: Typecheck media safety
        run: pnpm --filter @kidos/media-safety typecheck
