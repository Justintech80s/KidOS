name: KidOS Clean Windows VM CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/shell/**'
      - 'crates/**'
      - 'services/media-classifier/**'
      - 'scripts/windows/**'
      - 'tests/windows/**'
      - 'tests/e2e/**'
      - '.github/workflows/clean-windows-vm-ci.yml'

jobs:
  clean-windows-vm:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run release tests
        run: |
          pnpm -r test --run
          pnpm -r build
          cargo test --workspace
          cargo check --workspace

      - name: Package local AI classifier and bundled model
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "services/media-classifier[packaging]"
          python -c "from huggingface_hub import snapshot_download; snapshot_download(repo_id='openai/clip-vit-base-patch32', local_dir='services/media-classifier/dist/model')"
          Push-Location services/media-classifier
          pyinstaller --clean --noconfirm kidos-media-classifier.spec
          Pop-Location
          if (-not (Test-Path "services/media-classifier/dist/kidos-media-classifier.exe")) { throw "Classifier executable was not produced." }
          if (-not (Test-Path "services/media-classifier/dist/model/config.json")) { throw "Classifier model bundle was not produced." }

      - name: Build privileged Guardian service
        run: cargo build -p kidos-guardian-host --release

      - name: Build KidOS NSIS installer
        run: pnpm --filter @kidos/shell tauri build --bundles nsis

      - name: Generate release SHA256 manifest
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem target/release/bundle/nsis/*-setup.exe
          $files += Get-Item target/release/kidos-guardian-host.exe
          $files += Get-Item services/media-classifier/dist/kidos-media-classifier.exe
          $manifest = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($file.Name)"
          }
          $manifest | Set-Content -Path target/release/KidOS-SHA256SUMS.txt -Encoding ASCII
          Get-Content target/release/KidOS-SHA256SUMS.txt

      - name: Clean Windows install / service / recovery / uninstall test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          ./tests/windows/clean-vm-smoke.ps1 -InstallerPath $installer

      - name: Upload verified installer and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Clean-VM-Verified-Windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/KidOS-SHA256SUMS.txt
          if-no-files-found: error
