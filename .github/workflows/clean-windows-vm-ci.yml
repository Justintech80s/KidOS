name: KidOS Clean Windows VM CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apps/shell/**'
      - 'crates/**'
      - 'services/media-classifier/**'
      - 'scripts/windows/**'
      - 'tests/windows/**'
      - 'tests/e2e/**'
      - '.github/workflows/clean-windows-vm-ci.yml'

jobs:
  clean-windows-vm:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run release tests
        run: |
          pnpm -r test --run
          pnpm -r build
          cargo test --workspace
          cargo check --workspace

      - name: Package local AI classifier and bundled model
        shell: pwsh
        run: ./scripts/windows/package-media-classifier.ps1

      - name: Build privileged Guardian service
        run: cargo build -p kidos-guardian-host --release

      - name: Build KidOS NSIS installer
        run: pnpm --filter @kidos/shell tauri build --bundles nsis

      - name: Generate release SHA256 manifest
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem target/release/bundle/nsis/*-setup.exe
          $files += Get-Item target/release/kidos-guardian-host.exe
          $files += Get-Item services/media-classifier/dist/kidos-media-classifier/kidos-media-classifier.exe
          $manifest = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLower())  $($file.Name)"
          }
          $manifest | Set-Content -Path target/release/KidOS-SHA256SUMS.txt -Encoding ASCII
          Get-Content target/release/KidOS-SHA256SUMS.txt

      - name: Clean Windows install / service / recovery / uninstall test
        shell: pwsh
        timeout-minutes: 20
        run: |
          $installer = (Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName
          ./tests/windows/clean-vm-smoke.ps1 -InstallerPath $installer

      - name: Capture Windows lifecycle diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/release/diagnostics | Out-Null
          Get-Service KidOSGuardian,KidOSMediaClassifier -ErrorAction SilentlyContinue |
            Format-List * | Out-File target/release/diagnostics/services.txt
          Get-ScheduledTask -TaskName "KidOS Guardian Recovery" -ErrorAction SilentlyContinue |
            Format-List * | Out-File target/release/diagnostics/recovery-task.txt
          Get-Process |
            Sort-Object ProcessName |
            Format-Table Id,ProcessName,CPU,StartTime -AutoSize |
            Out-File target/release/diagnostics/processes.txt
          Get-ChildItem "$env:ProgramFiles\KidOS" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime |
            Out-File target/release/diagnostics/kidos-files.txt
          Get-ChildItem "$env:ProgramData\KidOS" -Recurse -ErrorAction SilentlyContinue |
            Select-Object FullName,Length,LastWriteTime |
            Out-File target/release/diagnostics/kidos-programdata.txt
          $credentialLog = Join-Path $env:ProgramData "KidOS\Diagnostics\credential-provisioning.log"
          if (Test-Path $credentialLog) {
            Copy-Item $credentialLog target/release/diagnostics/credential-provisioning.log -Force
          }
          $serviceInstallLog = Join-Path $env:ProgramData "KidOS\Diagnostics\service-install.log"
          if (Test-Path $serviceInstallLog) {
            Copy-Item $serviceInstallLog target/release/diagnostics/service-install.log -Force
          }
          $classifierLog = Join-Path $env:ProgramData "KidOS\Diagnostics\media-classifier-service.log"
          if (Test-Path $classifierLog) {
            Copy-Item $classifierLog target/release/diagnostics/media-classifier-service.log -Force
          }
          Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'KidOSGuardian|KidOSMediaClassifier' } |
            Select-Object TimeCreated,Id,LevelDisplayName,Message |
            Format-List * |
            Out-File target/release/diagnostics/service-control-manager-events.txt
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-30)} -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'KidOS|media classifier|guardian' } |
            Select-Object TimeCreated,ProviderName,Id,LevelDisplayName,Message |
            Format-List * |
            Out-File target/release/diagnostics/application-events.txt

      - name: Upload lifecycle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Clean-VM-Diagnostics
          path: target/release/diagnostics
          if-no-files-found: warn

      - name: Upload verified installer and integrity manifest
        uses: actions/upload-artifact@v4
        with:
          name: KidOS-Clean-VM-Verified-Windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/KidOS-SHA256SUMS.txt
          if-no-files-found: error
