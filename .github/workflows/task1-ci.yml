name: KidOS Task 1 CI

on:
  push:
    branches:
      - feat/task-1-kidos-shell
  pull_request:
    branches:
      - main

jobs:
  verify-shell:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run shell tests
        run: pnpm --filter @kidos/shell test --run

      - name: Build shell
        run: pnpm --filter @kidos/shell build

      - name: Check Rust workspace
        run: cargo check --workspace
