name: KidOS Task 2 CI

on:
  push:
    branches:
      - feat/task-2-shared-contracts
  pull_request:
    branches:
      - main

jobs:
  verify-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test contracts
        run: pnpm --filter @kidos/contracts test --run

      - name: Typecheck contracts
        run: pnpm --filter @kidos/contracts typecheck
