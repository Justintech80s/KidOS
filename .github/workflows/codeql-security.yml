name: KidOS CodeQL Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL JavaScript / TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout KidOS
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript

  rust-security:
    name: Rust security lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout KidOS
        uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux system dependencies for Tauri workspace
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libglib2.0-dev             libgtk-3-dev             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf

      - name: Run Rust tests
        run: cargo test --workspace

      - name: Security-focused Clippy
        run: cargo clippy --workspace --all-targets -- -D clippy::correctness -D clippy::suspicious -D clippy::perf

      - name: Audit Windows FFI boundary locations
        shell: bash
        run: |
          set -euo pipefail
          echo "Unsafe Rust is permitted only where Windows FFI requires it; all such sites are surfaced below for review."
          grep -RIn --include='*.rs' -E 'unsafe[[:space:]]*(\{|fn|impl|trait)' crates apps/shell/src-tauri/src || true
