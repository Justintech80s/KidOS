name: KidOS Desktop Release

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "apps/shell/**"
      - ".github/workflows/electron-desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish-electron-desktop:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Test Electron security boundary
        run: pnpm --filter @kidos/desktop test

      - name: Build Electron Windows installer
        run: pnpm --filter @kidos/desktop build

      - name: Prepare installer for signing
        shell: pwsh
        run: |
          $installer = Get-ChildItem "apps/desktop/dist-installer/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "KidOS Desktop installer was not produced." }
          Copy-Item $installer.FullName "KidOS-Desktop-Windows-x64-0.1.0-Setup.exe"

      - name: Check Artifact Signing configuration
        id: signing_config
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARTIFACT_SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          ARTIFACT_SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          $missing = @()
          if (-not $env:AZURE_CLIENT_ID) { $missing += "AZURE_CLIENT_ID secret" }
          if (-not $env:AZURE_TENANT_ID) { $missing += "AZURE_TENANT_ID secret" }
          if (-not $env:AZURE_SUBSCRIPTION_ID) { $missing += "AZURE_SUBSCRIPTION_ID secret" }
          if (-not $env:ARTIFACT_SIGNING_ENDPOINT) { $missing += "ARTIFACT_SIGNING_ENDPOINT variable" }
          if (-not $env:ARTIFACT_SIGNING_ACCOUNT) { $missing += "ARTIFACT_SIGNING_ACCOUNT variable" }
          if (-not $env:ARTIFACT_SIGNING_CERTIFICATE_PROFILE) { $missing += "ARTIFACT_SIGNING_CERTIFICATE_PROFILE variable" }

          if ($missing.Count -eq 0) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "Microsoft Artifact Signing is configured. The release will be signed."
          } else {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Warning "Artifact Signing is not configured yet. Publishing an UNSIGNED Electron preview instead."
            Write-Warning "Missing: $($missing -join ', ')"
          }

      - name: Azure login with GitHub OIDC
        if: steps.signing_config.outputs.enabled == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign KidOS Desktop installer with Microsoft Artifact Signing
        if: steps.signing_config.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\KidOS-Desktop-Windows-x64-0.1.0-Setup.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Microsoft code signature
        if: steps.signing_config.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signature = Get-AuthenticodeSignature "KidOS-Desktop-Windows-x64-0.1.0-Setup.exe"
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate
          if ($signature.Status -ne "Valid") {
            throw "KidOS Desktop installer does not have a valid Authenticode signature."
          }

      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "KidOS-Desktop-Windows-x64-0.1.0-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  KidOS-Desktop-Windows-x64-0.1.0-Setup.exe" | Set-Content "KidOS-Desktop-SHA256SUMS.txt"

      - name: Publish Desktop Preview release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENABLED: ${{ steps.signing_config.outputs.enabled }}
        run: |
          if ($env:SIGNING_ENABLED -eq "true") {
            $signatureLine = "This installer is digitally signed with Microsoft Artifact Signing, and the workflow verified the Authenticode signature before publishing."
          } else {
            $signatureLine = "This installer is currently UNSIGNED because Microsoft Artifact Signing credentials have not yet been configured in the repository. Windows may show an Unknown Publisher or SmartScreen warning."
          }

          $notes = @"
          KidOS Desktop is the fast-install Electron edition for Windows 10/11 x64.

          $signatureLine

          KidOS Desktop packages the KidOS interface as a conventional Windows desktop application. It does NOT activate the Guardian Windows service, Assigned Access, Restricted Safe Mode, or child-account lockdown. Use the separate protected Tauri + Rust Guardian edition when testing those security controls.
          "@
          gh release view desktop-latest --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload desktop-latest "KidOS-Desktop-Windows-x64-0.1.0-Setup.exe" "KidOS-Desktop-SHA256SUMS.txt" --clobber --repo "${{ github.repository }}"
            gh release edit desktop-latest --title "KidOS Desktop Electron Preview" --prerelease --notes $notes --repo "${{ github.repository }}"
          } else {
            gh release create desktop-latest "KidOS-Desktop-Windows-x64-0.1.0-Setup.exe" "KidOS-Desktop-SHA256SUMS.txt" --title "KidOS Desktop Electron Preview" --prerelease --notes $notes --repo "${{ github.repository }}"
          }
