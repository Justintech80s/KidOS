[package]
name = "kidos-guardian-host"
version = "0.1.0"
edition = "2021"

[dependencies]
guardian-service = { path = "../guardian-service" }
secure-store = { path = "../secure-store" }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_NetManagement",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Memory",
  "Win32_System_Pipes"
] }
serde_json = "1"
